; Las guias pueden pesar hasta 10 MB (mimes:pdf|max:10240)
upload_max_filesize = 11M
post_max_size = 12M

; Leer un PDF grande consume memoria; Render gratis tiene 512 MB en total
memory_limit = 256M

; Los errores van al registro, nunca a la pantalla del usuario
display_errors = Off
log_errors = On

; Guarda el codigo compilado: el plan gratis tiene poca CPU
opcache.enable = 1
opcache.validate_timestamps = 0
